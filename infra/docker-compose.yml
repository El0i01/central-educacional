# Ambiente local: docker compose -f infra/docker-compose.yml up --build
# Variáveis em infra/.env (modelo em .env.example na raiz). JWT_SECRET é obrigatório.
# Portas diferentes do Reurb (5442/3100/8180) para os dois rodarem juntos.

name: central

x-banco: &banco
  DATABASE_URL: postgres://${CENTRAL_DB_USUARIO:-central}:${CENTRAL_DB_SENHA:-central_local}@db:5432/${CENTRAL_DB_NOME:-central}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${CENTRAL_DB_NOME:-central}
      POSTGRES_USER: ${CENTRAL_DB_USUARIO:-central}
      POSTGRES_PASSWORD: ${CENTRAL_DB_SENHA:-central_local}
    volumes:
      - banco:/var/lib/postgresql/data
      # Cria o banco descartável dos testes (central_teste) na primeira subida.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - '127.0.0.1:${CENTRAL_DB_PORTA:-5443}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 30

  migrar:
    build:
      context: ..
      dockerfile: database/Dockerfile
    environment: *banco
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *banco
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET em infra/.env}
      CORS_ORIGENS: ${CORS_ORIGENS:-}
    ports:
      - '127.0.0.1:${CENTRAL_API_PORTA:-3200}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/saude').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      migrar:
        condition: service_completed_successfully

  # web: entra na tarefa 0.7 (apps/web + nginx).

volumes:
  banco:
