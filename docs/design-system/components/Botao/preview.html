<!doctype html>
<html>
<head><meta charset="utf-8"><title>Botao — prévia</title>
<style>#raiz{padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}</style></head>
<body>
<div id="raiz"></div>
<script>
  var C = window.CentralUI, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('raiz')).render(h(React.Fragment, null,
    h(C.Botao, { variante: 'primario', icone: 'seta' }, 'Enviar à coordenação'),
    h(C.Botao, null, 'Salvar rascunho'),
    h(C.Botao, { ocupado: true }, 'Salvando…'),
    h(C.Botao, { variante: 'discreto', href: '#historico' }, 'Ver histórico'),
    h(C.Botao, { variante: 'perigo', icone: 'voltar' }, 'Devolver para ajuste')));
</script>
</body>
</html>
