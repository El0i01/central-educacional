<title>Projeto Central Educacional</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: faixa de marca no topo; índice fixo à esquerda e documento numa coluna de leitura. */
:root {
  --fundo: #f4f6fa;
  --superficie: #ffffff;
  --superficie-2: #eaf0f8;
  --tinta: #1b2638;
  --tinta-suave: #4f5d72;
  --linha: #d8e0eb;
  --semed: #2b5598;
  --semed-escuro: #1d3d70;
  --semed-claro: #dbe6f6;
  --sobre-semed: #ffffff;
  --ok: #1f6f4a;
  --font-titulo: "Lexend", "Segoe UI", system-ui, sans-serif;
  --font-texto: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fundo: #0f1522; --superficie: #161e2e; --superficie-2: #1d2840; --tinta: #e6ecf5;
    --tinta-suave: #a5b2c6; --linha: #2a3650; --semed: #8fb1e8; --semed-escuro: #b9cff2;
    --semed-claro: #22345a; --sobre-semed: #0f1522; --ok: #6fd0a0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fundo: #0f1522; --superficie: #161e2e; --superficie-2: #1d2840; --tinta: #e6ecf5;
  --tinta-suave: #a5b2c6; --linha: #2a3650; --semed: #8fb1e8; --semed-escuro: #b9cff2;
  --semed-claro: #22345a; --sobre-semed: #0f1522; --ok: #6fd0a0; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 16px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  background: var(--fundo); color: var(--tinta); font-family: var(--font-texto);
  font-size: 16px; line-height: 1.6;
}
a { color: var(--semed); text-underline-offset: 2px; }
a:focus-visible { outline: 3px solid var(--semed); outline-offset: 2px; border-radius: 3px; }

.marca {
  background: var(--superficie); border-bottom: 1px solid var(--linha);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.marca-in {
  max-width: 1240px; margin: 0 auto; padding-block: 20px;
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
}
.marca img { width: 64px; height: 64px; border-radius: 12px; background: #f4f4f4; flex: none; }
.marca h1 {
  font-family: var(--font-titulo); font-weight: 600; font-size: 1.6rem; line-height: 1.15;
  margin: 0; text-wrap: balance;
}
.marca p { margin: 2px 0 0; color: var(--tinta-suave); font-size: .95rem; }
.atalhos { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.atalho {
  font-family: var(--font-titulo); font-weight: 500; font-size: .9rem; text-decoration: none;
  color: var(--sobre-semed); background: var(--semed); padding: 8px 14px; border-radius: 8px;
}
.atalho:hover { background: var(--semed-escuro); }
.selo { font-family: var(--font-mono); font-size: .75rem; letter-spacing: .04em;
  text-transform: uppercase; color: var(--semed); background: var(--semed-claro);
  padding: 6px 10px; border-radius: 6px; white-space: nowrap;
}

.grade {
  max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 250px minmax(0, 1fr);
  gap: 40px; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
nav.indice { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; max-height: 100vh; overflow-y: auto; padding-block: 4px 24px; }
nav.indice > ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
nav.indice ul ul { list-style: none; margin: 6px 0 0; padding: 0 0 0 12px; border-left: 1px solid var(--linha); display: grid; gap: 2px; }
.nav-doc { font-family: var(--font-titulo); font-weight: 500; font-size: .98rem; color: var(--tinta); text-decoration: none; }
nav.indice ul ul a { color: var(--tinta-suave); text-decoration: none; font-size: .88rem; line-height: 1.35; display: block; padding: 3px 0; }
nav.indice a:hover { color: var(--semed); }

main { min-width: 0; display: grid; gap: 28px; }
.doc {
  background: var(--superficie); border: 1px solid var(--linha); border-radius: 10px;
  padding: clamp(18px, 4vw, 40px); min-width: 0;
}
.doc-cab { border-bottom: 2px solid var(--semed); padding-bottom: 12px; margin-bottom: 8px; }
.rotulo { font-family: var(--font-mono); font-size: .75rem; color: var(--tinta-suave); letter-spacing: .03em; }
.doc h2 { font-family: var(--font-titulo); font-weight: 600; font-size: 1.9rem; line-height: 1.2; margin: 4px 0 0; color: var(--semed-escuro); }
.doc h3 { font-family: var(--font-titulo); font-weight: 600; font-size: 1.3rem; line-height: 1.3; margin: 2.2em 0 .5em; text-wrap: balance; }
.doc h4 { font-family: var(--font-titulo); font-weight: 500; font-size: 1.08rem; margin: 1.8em 0 .4em; color: var(--semed-escuro); }
.doc h5 { font-size: 1rem; margin: 1.4em 0 .3em; }
.doc p, .doc li { max-width: 72ch; }
.doc ul, .doc ol { padding-left: 1.3em; }
.doc li { margin: .25em 0; }
.doc hr { border: 0; border-top: 1px solid var(--linha); margin: 2.4em 0; }
code {
  font-family: var(--font-mono); font-size: .86em; background: var(--superficie-2);
  padding: .1em .35em; border-radius: 4px; overflow-wrap: anywhere;
}
.rolagem { overflow-x: auto; margin: 1em 0; }
table { border-collapse: collapse; width: 100%; font-size: .93rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--linha); }
th { font-family: var(--font-titulo); font-weight: 500; font-size: .85rem; color: var(--tinta-suave); background: var(--superficie-2); white-space: nowrap; }
td:first-child code { white-space: nowrap; }
.ok { color: var(--ok); font-weight: 700; }
pre.bloco {
  font-family: var(--font-mono); font-size: .82rem; line-height: 1.45; background: var(--superficie-2);
  padding: 16px; border-radius: 8px; margin: 0; width: max-content; min-width: 100%;
}
figure.diagrama {
  margin: 1.2em 0; padding: 16px; background: var(--fundo); border: 1px solid var(--linha);
  border-radius: 8px; overflow-x: auto;
}
figure.diagrama pre.mermaid { margin: 0; background: transparent; display: flex; justify-content: center; }

@media (max-width: 860px) {
  .grade { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  nav.indice { position: static; max-height: none; background: var(--superficie); border: 1px solid var(--linha); border-radius: 10px; padding: 16px; }
  nav.indice ul ul { display: none; }
  nav.indice > ul { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; }
  .atalhos { margin-left: 0; }
  .doc h2 { font-size: 1.55rem; }
}
</style>
<style>
/*{{CSS_DS}}*/
/* Vitrine do design system */
.vitrine { margin: 1.4em 0 2em; border: 1px solid var(--linha); border-radius: 12px; background: var(--fundo); padding: clamp(14px, 3vw, 24px); display: grid; gap: 14px; min-width: 0; }
.v-barra-topo { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.v-barra-topo span { color: var(--tinta-suave); font-size: .9rem; flex: 1 1 260px; }
.vitrine .v-titulo { font-family: var(--font-titulo); font-weight: 600; font-size: 1.05rem; margin: 18px 0 0; color: var(--semed-escuro); }
.v-nota { margin: -6px 0 0; color: var(--tinta-suave); font-size: .92rem; }
.v-cores { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.v-cor { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 2px 10px; align-items: start; background: var(--superficie); border: 1px solid var(--linha); border-radius: 8px; padding: 10px; }
.v-amostra { grid-row: span 2; width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--linha); }
.v-cor code { background: none; padding: 0; font-size: .8rem; }
.v-cor small { color: var(--tinta-suave); font-size: .78rem; line-height: 1.35; }
.v-tipos { display: grid; gap: 8px; }
.v-tipo { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 12px; align-items: baseline; background: var(--superficie); border: 1px solid var(--linha); border-radius: 8px; padding: 12px 14px; color: var(--tinta); }
.v-tipo-meta { display: grid; }
.v-tipo-meta code { background: none; padding: 0; }
.v-tipo-meta small { color: var(--tinta-suave); font-size: .8rem; }
.v-medidas { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.v-medida { display: flex; align-items: center; gap: 10px; background: var(--superficie); border: 1px solid var(--linha); border-radius: 8px; padding: 10px 12px; }
.v-medida code { background: none; padding: 0; min-width: 84px; font-size: .8rem; }
.v-medida small { color: var(--tinta-suave); margin-left: auto; font-family: var(--font-mono); font-size: .78rem; }
.v-barra { display: block; height: 12px; background: var(--semed); border-radius: 2px; }
.v-raio { display: block; width: 36px; height: 36px; background: var(--semed-claro); border: 2px solid var(--semed); }
.v-comps { display: grid; gap: 12px; }
.v-comp { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; background: var(--superficie); border: 1px solid var(--linha); border-radius: 10px; padding: 16px; min-width: 0; }
.v-comp-cab h4 { margin: 0; font-family: var(--font-mono); font-size: .9rem; font-weight: 500; color: var(--semed); }
.v-comp-cab p { margin: 6px 0 0; font-size: .88rem; color: var(--tinta-suave); line-height: 1.45; }
.v-demo { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; min-width: 0; }
.v-pilha { display: grid; gap: 12px; width: 100%; max-width: 520px; }
.v-estreito { width: 100%; max-width: 400px; }
.v-cartoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; width: 100%; }
.v-demo-celular { justify-content: center; padding: 8px 0; }
.v-celular { width: 360px; max-width: 100%; border: 1px solid var(--linha); border-radius: 22px; background: var(--fundo); overflow: hidden; box-shadow: var(--sombra-flutuante); display: flex; flex-direction: column; }
.v-cel-topo { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 16px; background: var(--superficie); border-bottom: 1px solid var(--linha); }
.v-cel-voltar { color: var(--semed); font-weight: 600; }
.v-cel-corpo { display: grid; gap: 18px; padding: 16px; justify-items: start; }
.v-cel-corpo > * { width: 100%; }
.v-cel-corpo > .ce-selo { width: auto; }
.v-cel-sobre { margin: 0; color: var(--tinta-suave); font-size: .85rem; }
.v-cel-nome { margin: -12px 0 0; font-family: var(--font-titulo); font-size: 1.4rem; font-weight: 600; color: var(--tinta); }
.v-cel-acoes { position: sticky; bottom: 0; background: var(--superficie); border-top: 1px solid var(--linha); padding: 12px 16px; display: grid; gap: 8px; box-shadow: var(--sombra-flutuante); }
.v-cel-falta { margin: 0; font-size: .85rem; color: var(--tinta-suave); }
.v-cel-botoes { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; }
@media (max-width: 700px) {
  .v-comp, .v-tipo { grid-template-columns: minmax(0, 1fr); }
}
</style>

<header class="marca">
  <div class="marca-in">
    <img src="{{LOGO}}" alt="Logo da SEMED de Itapuã do Oeste">
    <div>
      <h1>Central Educacional</h1>
      <p>SEMED Itapuã do Oeste/RO · documentação do projeto, para análise antes do código</p>
    </div>
    <div class="atalhos">
      <span class="selo">Primeiro módulo: FLEO</span>
      <a class="atalho" href="https://claude.ai/artifact/6qpvWFRzVb5NLUJjQHWyzE" target="_blank" rel="noopener">Design system</a>
    </div>
  </div>
</header>

<div class="grade">
  <nav class="indice" aria-label="Índice da documentação">
    <ul>{{NAV}}</ul>
  </nav>
  <main>
    {{SECOES}}
  </main>
</div>
